<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Skipink</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="page" width="960" height="640" aria-hidden="true"></canvas>
    <button id="jump" class="jump" type="button">Start</button>
    <div class="top-controls">
      <button id="view-toggle" class="control-btn view-toggle" type="button" aria-label="Switch to enhanced view" title="Toggle Enhanced View (V)">✧</button>
      <button id="color-toggle" class="control-btn color-toggle" type="button" aria-label="Cycle outfit color" title="Change Color (C)">🎨</button>
      <button id="random-toggle" class="control-btn random-toggle" type="button" aria-label="Random character and color" title="Randomize (R)">🎲</button>
      <button id="upload-toggle" class="control-btn upload-toggle" type="button" aria-label="Upload custom character" title="Upload Custom Character (U)">🖼️</button>
      <input type="file" id="custom-char-file" accept="image/*" class="sr-only" aria-label="Upload custom character image file" />
    </div>
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
